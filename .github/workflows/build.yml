name: Windows Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtmultimedia'

    - name: Install Catch2
      run: |
        git clone --depth 1 --branch v3.16.1 https://github.com/catchorg/Catch2.git "$env:RUNNER_TEMP/Catch2"
        cmake -S "$env:RUNNER_TEMP/Catch2" -B "$env:RUNNER_TEMP/Catch2-build" -DBUILD_TESTING=OFF
        cmake --build "$env:RUNNER_TEMP/Catch2-build" --config Release
        cmake --install "$env:RUNNER_TEMP/Catch2-build" --config Release --prefix "$env:RUNNER_TEMP/Catch2-install"

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCatch2_DIR="$env:RUNNER_TEMP/Catch2-install/lib/cmake/Catch2" -DDEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"

    - name: Build Core and App
      run: cmake --build build --config Release

    - name: Run Tests
      working-directory: build
      run: ctest -C Release --output-on-failure

    - name: Deploy Qt Runtime
      shell: cmd
      run: |
        mkdir deploy
        copy build\Release\XieQian.exe deploy\
        windeployqt deploy\XieQian.exe --release --qmldir ui\qml --no-translations --no-system-d3d-compiler

    - name: Package Portable Zip
      shell: pwsh
      run: Compress-Archive -Path deploy\* -DestinationPath XieQian-Windows.zip -Force

    - name: Compile Installer
      shell: cmd
      run: |
        choco install innosetup -y
        call refreshenv
        iscc installer.iss

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XieQian-Windows
        path: XieQian-Windows.zip

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: XieQian-Setup
        path: installer-output/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XieQian-Setup
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: XieQian-Windows
          path: artifacts/
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/XieQian-Setup-*.exe
            artifacts/XieQian-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
